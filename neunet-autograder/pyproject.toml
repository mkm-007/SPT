[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neunet-autograder"
version = "0.1.0"
description = "Autograder for CSC 8851 Deep Learning assignments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nbformat>=5.9",
    "nbconvert>=7.16",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.scripts]
neunet-grade = "autograder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autograder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
